<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#F4FBF7">
<title>Talleres · Centro Cuídate</title>
<meta name="description" content="Reserva tu plaza en los talleres de Centro Cuídate. Plazas limitadas. Reserva y paga online en segundos.">
<meta name="robots" content="index,follow">
<meta property="og:title" content="Talleres · Centro Cuídate">
<meta property="og:description" content="Reserva tu plaza en nuestros talleres. Plazas limitadas.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1FAA76; --green-light:#2ECC8E; --green-dark:#0F7D52; --green-deep:#075339;
  --gold:#C9952A; --gold-light:#D4A24A; --gold-dark:#8A6010;
  --bg:#F4FBF7; --bg-2:#EAF5EE; --surface:#FFFFFF; --surface-2:#F7FBF8; --surface-3:#EBF5EF;
  --border:rgba(15,77,52,.08); --border-2:rgba(15,77,52,.15); --border-accent:rgba(31,170,118,.32);
  --text:#0E2419; --text-2:rgba(14,36,25,.72); --text-3:rgba(14,36,25,.48); --text-muted:rgba(14,36,25,.28);
  --red:#D84A3F; --amber:#E89B1B; --blue:#2B7DD1; --wa:#25D366;
  --r-sm:10px; --r:14px; --r-md:18px; --r-lg:24px; --r-xl:32px; --r-pill:999px;
  --sh-sm:0 2px 8px rgba(15,77,52,.06);
  --sh:0 8px 26px rgba(15,77,52,.10);
  --sh-lg:0 18px 50px rgba(15,77,52,.16);
  --grad:linear-gradient(135deg,var(--green-light),var(--green-dark));
  --grad-gold:linear-gradient(135deg,var(--gold-light),var(--gold-dark));
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;min-height:100dvh;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1000px 500px at 15% -5%, rgba(46,204,142,.16), transparent 60%),
    radial-gradient(900px 480px at 110% 0%, rgba(201,149,42,.10), transparent 55%),
    radial-gradient(700px 500px at 50% 115%, rgba(31,170,118,.10), transparent 60%);
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 48px}
img{max-width:100%;display:block}
a{color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}

.hero{padding:34px 4px 20px;text-align:center;position:relative}
.hero-logo{
  width:74px;height:74px;border-radius:22px;margin:0 auto 14px;
  background:var(--grad);display:flex;align-items:center;justify-content:center;
  font-size:36px;box-shadow:var(--sh);
}
.hero-eyebrow{
  display:inline-block;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--green-dark);background:rgba(31,170,118,.10);padding:5px 14px;border-radius:var(--r-pill);
  margin-bottom:12px;
}
.hero-title{font-family:'Playfair Display',serif;font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.08}
.hero-title .accent{color:var(--green-dark)}
.hero-sub{margin-top:10px;font-size:14.5px;font-weight:600;color:var(--text-2);max-width:400px;margin-left:auto;margin-right:auto}
.hero-center{
  margin-top:16px;display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;font-weight:700;color:var(--text-2);
  background:var(--surface);padding:8px 15px;border-radius:var(--r-pill);
  box-shadow:var(--sh-sm);border:1px solid var(--border);
}

.sec-label{display:flex;align-items:center;gap:10px;margin:26px 2px 14px}
.sec-label h2{font-size:17px;font-weight:900;letter-spacing:-.01em}
.sec-label .count{
  font-size:11px;font-weight:800;color:var(--green-dark);
  background:rgba(31,170,118,.10);padding:3px 10px;border-radius:var(--r-pill);
}

.ws-grid{display:flex;flex-direction:column;gap:14px}
.ws-card{
  position:relative;background:var(--surface);border-radius:var(--r-lg);
  box-shadow:var(--sh);overflow:hidden;border:1px solid var(--border);
  transition:transform .16s cubic-bezier(.22,.61,.36,1), box-shadow .2s;
  cursor:pointer;
}
.ws-card:active{transform:scale(.985)}
.ws-card.selected{box-shadow:0 0 0 2.5px var(--green-light), var(--sh-lg)}
.ws-card-top{
  position:relative;padding:18px 18px 16px;
  background:linear-gradient(135deg, rgba(46,204,142,.14), rgba(31,170,118,.05));
}
.ws-date-badge{display:flex;align-items:center;gap:14px}
.ws-date-cal{
  width:58px;height:64px;border-radius:16px;background:var(--surface);
  box-shadow:var(--sh-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;border:1px solid var(--border);
}
.ws-date-cal .m{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--green-dark);width:100%;text-align:center;padding:3px 0}
.ws-date-cal .d{font-size:26px;font-weight:900;line-height:1;margin-top:6px;color:var(--text)}
.ws-date-cal .w{font-size:9px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.ws-date-info{flex:1;min-width:0}
.ws-name{font-size:17px;font-weight:900;letter-spacing:-.01em;line-height:1.2}
.ws-time{margin-top:5px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--green-dark)}
.ws-card-body{padding:14px 18px 18px}
.ws-note{font-size:13px;font-weight:600;color:var(--text-2);line-height:1.55;margin-bottom:14px}
.ws-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ws-chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;
  padding:6px 12px;border-radius:var(--r-pill);background:var(--surface-3);color:var(--text-2);
}
.ws-chip.price{background:var(--grad-gold);color:#fff}
.ws-chip.spots{background:rgba(31,170,118,.10);color:var(--green-dark)}
.ws-chip.spots.few{background:rgba(232,155,27,.14);color:var(--gold-dark)}
.ws-cta{
  margin-top:16px;width:100%;padding:14px;border-radius:var(--r);
  background:var(--grad);color:#fff;font-size:15px;font-weight:900;letter-spacing:.01em;
  box-shadow:0 6px 18px rgba(31,170,118,.3);transition:transform .12s, filter .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.ws-cta:active{transform:scale(.97);filter:brightness(1.05)}
.ws-spots-bar{height:6px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden;margin-top:14px}
.ws-spots-fill{height:100%;border-radius:var(--r-pill);background:var(--grad);transition:width .5s cubic-bezier(.22,.61,.36,1)}
.ws-spots-fill.few{background:var(--grad-gold)}
.ws-ribbon{
  position:absolute;top:14px;right:-30px;transform:rotate(45deg);
  background:var(--grad-gold);color:#fff;font-size:10px;font-weight:900;letter-spacing:.08em;
  text-transform:uppercase;padding:5px 34px;box-shadow:var(--sh-sm);z-index:2;
}

.empty{text-align:center;padding:44px 20px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-sm);border:1px solid var(--border)}
.empty .ico{font-size:48px;margin-bottom:14px}
.empty h3{font-size:17px;font-weight:900;margin-bottom:8px}
.empty p{font-size:13.5px;font-weight:600;color:var(--text-2);line-height:1.6;max-width:340px;margin:0 auto}
.empty .wa-btn{
  display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:12px 22px;
  background:var(--wa);color:#fff;border-radius:var(--r-pill);font-size:13.5px;font-weight:800;text-decoration:none;
  box-shadow:0 6px 16px rgba(37,211,102,.28);
}
.skel{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow:hidden;height:150px;position:relative;border:1px solid var(--border)}
.skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:shim 1.3s infinite}
@keyframes shim{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

.ovl{position:fixed;inset:0;z-index:100;background:rgba(7,45,30,.42);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s;pointer-events:none}
.ovl.on{opacity:1;pointer-events:auto}
.sheet{
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--sh-lg);
  transform:translateY(100%);transition:transform .32s cubic-bezier(.22,.61,.36,1);
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
}
.ovl.on .sheet{transform:translateY(0)}
.sheet-handle{width:44px;height:5px;border-radius:99px;background:var(--border-2);margin:12px auto 4px}
.sheet-head{padding:8px 22px 4px;display:flex;align-items:center;justify-content:space-between}
.sheet-title{font-size:20px;font-weight:900;letter-spacing:-.01em}
.sheet-close{width:34px;height:34px;border-radius:11px;background:var(--surface-3);color:var(--text-3);font-size:20px;display:flex;align-items:center;justify-content:center}
.sheet-body{padding:12px 22px 4px}

.book-summary{
  display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(46,204,142,.12),rgba(31,170,118,.04));
  border:1px solid var(--border-accent);border-radius:var(--r-md);padding:14px 16px;margin-bottom:18px;
}
.book-summary .cal{width:52px;height:58px;border-radius:14px;background:var(--surface);box-shadow:var(--sh-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.book-summary .cal .m{font-size:9px;font-weight:900;text-transform:uppercase;color:#fff;background:var(--green-dark);width:100%;text-align:center;padding:2px 0}
.book-summary .cal .d{font-size:22px;font-weight:900;margin-top:4px}
.book-summary .info{flex:1;min-width:0}
.book-summary .info .n{font-size:15px;font-weight:900}
.book-summary .info .t{font-size:12.5px;font-weight:700;color:var(--green-dark);margin-top:3px}
.book-summary .price{text-align:right;flex-shrink:0}
.book-summary .price .amt{font-size:20px;font-weight:900;color:var(--gold-dark)}
.book-summary .price .lbl{font-size:9px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--text-2);margin-bottom:7px;letter-spacing:.01em}
.field input,.field textarea{
  width:100%;padding:13px 15px;border:1.5px solid var(--border-2);border-radius:var(--r);
  background:var(--surface-2);font-family:inherit;font-size:15px;font-weight:600;color:var(--text);
  transition:border-color .15s, background .15s;
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--green-light);background:var(--surface)}
.field textarea{resize:none;min-height:66px}
.gdpr{display:flex;align-items:flex-start;gap:10px;margin:6px 0 16px;font-size:12px;font-weight:600;color:var(--text-2);line-height:1.5}
.gdpr input{width:20px;height:20px;flex-shrink:0;margin-top:1px;accent-color:var(--green)}
.gdpr a{color:var(--green-dark);font-weight:800}
.err-msg{display:none;background:rgba(216,74,63,.08);border:1px solid rgba(216,74,63,.2);color:var(--red);font-size:12.5px;font-weight:700;padding:10px 14px;border-radius:var(--r);margin-bottom:12px}
.err-msg.on{display:block}

.pay-btn{
  width:100%;padding:16px;border-radius:var(--r-md);background:var(--grad-gold);color:#fff;
  font-size:16px;font-weight:900;letter-spacing:.01em;box-shadow:0 8px 22px rgba(201,149,42,.32);
  display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .12s, filter .15s;
}
.pay-btn:active{transform:scale(.98);filter:brightness(1.05)}
.pay-btn:disabled{opacity:.6;filter:grayscale(.3)}
.pay-note{text-align:center;font-size:11px;font-weight:700;color:var(--text-3);margin-top:12px;line-height:1.5}
.pay-secure{display:inline-flex;align-items:center;gap:5px}

.success-wrap{text-align:center;padding:16px 6px 8px}
.success-ring{
  width:92px;height:92px;border-radius:50%;margin:8px auto 20px;
  background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:46px;color:#fff;
  box-shadow:0 12px 34px rgba(31,170,118,.36);animation:pop .5s cubic-bezier(.22,1.4,.5,1);
}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.success-wrap h2{font-family:'Playfair Display',serif;font-size:26px;font-weight:800;margin-bottom:8px}
.success-wrap p{font-size:14px;font-weight:600;color:var(--text-2);line-height:1.6;max-width:380px;margin:0 auto 18px}
.success-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;text-align:left;margin:0 6px 16px}
.success-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;font-weight:700}
.success-row .k{color:var(--text-3);width:78px;flex-shrink:0;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.success-row .v{color:var(--text);font-weight:800}

.foot{text-align:center;margin-top:36px;padding-top:20px;border-top:1px solid var(--border)}
.foot .addr{font-size:12.5px;font-weight:700;color:var(--text-2);line-height:1.7}
.foot .addr a{color:var(--green-dark);font-weight:800;text-decoration:none}
.foot .brand{margin-top:14px;font-size:11px;font-weight:800;color:var(--text-muted);letter-spacing:.04em}

.processing{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.spinner{width:52px;height:52px;border:5px solid var(--surface-3);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.processing h3{font-size:18px;font-weight:900}
.processing p{font-size:13.5px;font-weight:600;color:var(--text-2);max-width:320px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<div id="processing" class="processing" style="display:none">
  <div class="spinner"></div>
  <h3 id="procTitle">Confirmando tu reserva…</h3>
  <p id="procMsg">Estamos registrando tu pago. No cierres esta ventana.</p>
</div>

<div class="wrap">
  <header class="hero">
    <div class="hero-logo">🌿</div>
    <span class="hero-eyebrow">Talleres · Plazas limitadas</span>
    <h1 class="hero-title">Reserva tu <span class="accent">plaza</span></h1>
    <p class="hero-sub">Elige tu taller, reserva y paga online en segundos. Tu plaza queda confirmada al instante.</p>
    <div class="hero-center" id="heroCenter">🌿 Centro Cuídate · Coín</div>
  </header>

  <div class="sec-label">
    <h2>Próximos talleres</h2>
    <span class="count" id="wsCount" style="display:none"></span>
  </div>
  <div id="wsGrid" class="ws-grid">
    <div class="skel"></div>
    <div class="skel"></div>
  </div>

  <footer class="foot">
    <div class="addr" id="footAddr"></div>
    <div class="brand">MDC Leiva · Gestión de Centros</div>
  </footer>
</div>

<div class="ovl" id="ovl" style="display:none">
  <div class="sheet" id="sheet"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" onerror="console.log('FB app offline')"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js" onerror="console.log('FB db offline')"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   BOOKING · SOLO TALLERES · Centro Cuídate / MDC Leiva
   Flujo: elegir taller → datos → pagar (SumUp) → volver → confirmado
   Compatible con la app: mismas rutas de Firebase.
   ═══════════════════════════════════════════════════════════════ */

var FB={
  apiKey:"AIzaSyDyd65tOvgS52SW7bruAZDdxU3tfOX8Fek",
  authDomain:"centrocuidatecoin.firebaseapp.com",
  databaseURL:"https://centrocuidatecoin-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"centrocuidatecoin"
};

var CENTERS={
  cc:{ id:'cc', emoji:'🌿', name:'Centro Cuídate', sub:'Bienestar Integral · Coín',
    address:'Calle Arquímedes 32, Oficina 9', city:'29100 Coín, Málaga',
    mapsUrl:'https://maps.google.com/?q=Calle+Arquimedes+32+Oficina+9+29100+Coin+Malaga',
    color:'#2ECC8E' }
};

var sede=(new URLSearchParams(location.search).get('sede')||'cc').toLowerCase();
if(!CENTERS[sede])sede='cc';
var center=CENTERS[sede];
var fbDB=null;
var ownerPhone='';
var workshops={};
var selectedWorkshop=null;

var MESES=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
var DIAS=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
var DIAS_LARGO=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES_LARGO=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function $(id){return document.getElementById(id);}
function fmtFullDate(iso){
  var d=new Date(iso+'T00:00:00');
  return DIAS_LARGO[d.getDay()]+', '+d.getDate()+' de '+MESES_LARGO[d.getMonth()];
}
function normPhone(s){s=(s||'').trim();var plus=s.charAt(0)==='+';var d=s.replace(/[^0-9]/g,'');return (plus?'+':'')+d;}
function validPhone(s){var d=(s||'').replace(/[^0-9]/g,'');return d.length>=9&&d.length<=15;}

(function initFB(){
  try{
    if(typeof firebase==='undefined'||!firebase.initializeApp){renderWorkshops();return;}
    var app=firebase.initializeApp(FB);
    fbDB=firebase.database(app);
    fbDB.ref('centrocuidate/booking/'+sede+'/config').once('value').then(function(s){
      var cfg=s.val()||{};
      ownerPhone=(cfg.ownerPhone||'').replace(/[\s\-\+]/g,'');
    }).catch(function(){});
    fbDB.ref('centrocuidate/booking/'+sede+'/workshops').on('value',function(s){
      workshops=s.val()||{};
      renderWorkshops();
    },function(){ renderWorkshops(); });
  }catch(e){ fbDB=null; renderWorkshops(); }
})();

function renderWorkshops(){
  var grid=$('wsGrid'); if(!grid)return;
  var todayStr=new Date().toISOString().slice(0,10);
  var nowMins=new Date().getHours()*60+new Date().getMinutes();
  var list=[];
  Object.keys(workshops||{}).forEach(function(id){
    var w=workshops[id];
    if(!w||!w.date||!w.time||w.cancelled)return;
    if(w.date<todayStr)return;
    if(w.date===todayStr){
      var tp=(w.time||'').split(':'); var wm=(+tp[0]||0)*60+(+tp[1]||0);
      if(wm<=nowMins)return;
    }
    var maxAt=w.maxAttendees||8;
    var occupied=Array.isArray(w.attendees)?w.attendees.length:Object.keys(w.attendees||{}).length;
    list.push({id:id,date:w.date,time:w.time,max:maxAt,occupied:occupied,
      note:w.note||'',price:(typeof w.price==='number'?w.price:parseFloat(w.price)||0),
      sumupLink:w.sumupLink||'', name:w.name||'Taller Skin Care'});
  });
  list.sort(function(a,b){ if(a.date!==b.date)return a.date<b.date?-1:1; return a.time<b.time?-1:1; });

  var cnt=$('wsCount');
  if(list.length){ cnt.style.display=''; cnt.textContent=list.length+(list.length===1?' fecha':' fechas'); }
  else if(cnt){ cnt.style.display='none'; }

  if(!list.length){
    grid.innerHTML='<div class="empty">'
      +'<div class="ico">🗓️</div>'
      +'<h3>Aún no hay talleres programados</h3>'
      +'<p>Estamos preparando las próximas fechas. Si quieres que te avisemos o reservar plaza, escríbenos por WhatsApp.</p>'
      +(ownerPhone?'<a class="wa-btn" target="_blank" rel="noopener" href="https://wa.me/'+(ownerPhone.indexOf("34")===0?ownerPhone:'34'+ownerPhone)+'?text='+encodeURIComponent('Hola, me interesa apuntarme a los talleres de Centro Cuídate cuando programéis las próximas fechas.')+'">💬 Avísame por WhatsApp</a>':'')
      +'</div>';
    updateChrome();
    return;
  }

  var html='';
  list.forEach(function(w,idx){
    var d=new Date(w.date+'T00:00:00');
    var left=Math.max(0,w.max-w.occupied);
    var few=left<=3;
    var pctFull=Math.min(100,Math.round(w.occupied/w.max*100));
    var featured=idx===0;
    html+='<article class="ws-card'+(selectedWorkshop&&selectedWorkshop.id===w.id?' selected':'')+'" onclick="openBooking(\''+w.id+'\')">';
    if(featured)html+='<div class="ws-ribbon">Próximo</div>';
    html+='<div class="ws-card-top"><div class="ws-date-badge">';
    html+='<div class="ws-date-cal"><span class="m">'+MESES[d.getMonth()]+'</span><span class="d">'+d.getDate()+'</span><span class="w">'+DIAS[d.getDay()]+'</span></div>';
    html+='<div class="ws-date-info">';
    html+='<div class="ws-name">'+esc(w.name)+'</div>';
    html+='<div class="ws-time">🕐 '+esc(w.time)+' h · '+fmtFullDate(w.date)+'</div>';
    html+='</div></div></div>';
    html+='<div class="ws-card-body">';
    if(w.note)html+='<div class="ws-note">'+esc(w.note)+'</div>';
    html+='<div class="ws-meta">';
    if(w.price>0)html+='<span class="ws-chip price">💳 '+w.price.toFixed(2).replace('.',',')+' €</span>';
    html+='<span class="ws-chip spots'+(few?' few':'')+'">👥 '+(left>0?(left+' plaza'+(left!==1?'s':'')+' libre'+(left!==1?'s':'')):'Completo')+'</span>';
    html+='</div>';
    html+='<div class="ws-spots-bar"><div class="ws-spots-fill'+(few?' few':'')+'" style="width:'+pctFull+'%"></div></div>';
    html+='<button class="ws-cta" type="button" onclick="event.stopPropagation();openBooking(\''+w.id+'\')">✨ Reservar mi plaza</button>';
    html+='</div></article>';
  });
  grid.innerHTML=html;
  updateChrome();
}

function updateChrome(){
  var fa=$('footAddr');
  if(fa)fa.innerHTML='📍 <a href="'+center.mapsUrl+'" target="_blank" rel="noopener">'+esc(center.address)+', '+esc(center.city)+'</a>';
  var hc=$('heroCenter'); if(hc)hc.innerHTML=center.emoji+' '+esc(center.name)+' · Coín';
}

function openBooking(wsId){
  var w=workshops[wsId]; if(!w)return;
  var maxAt=w.maxAttendees||8;
  var occupied=Array.isArray(w.attendees)?w.attendees.length:Object.keys(w.attendees||{}).length;
  if(occupied>=maxAt){ toast('Este taller está completo'); return; }
  selectedWorkshop={id:wsId,date:w.date,time:w.time,price:(typeof w.price==='number'?w.price:parseFloat(w.price)||0),
    sumupLink:w.sumupLink||'', name:w.name||'Taller Skin Care', max:maxAt, dur:(w.dur||90)};
  var d=new Date(w.date+'T00:00:00');
  var priceStr=selectedWorkshop.price>0?selectedWorkshop.price.toFixed(2).replace('.',','):'—';

  var h='<div class="sheet-handle"></div>';
  h+='<div class="sheet-head"><div class="sheet-title">Reservar plaza</div>';
  h+='<button class="sheet-close" onclick="closeSheet()" aria-label="Cerrar">×</button></div>';
  h+='<div class="sheet-body">';
  h+='<div class="book-summary">';
  h+='<div class="cal"><span class="m">'+MESES[d.getMonth()]+'</span><span class="d">'+d.getDate()+'</span></div>';
  h+='<div class="info"><div class="n">'+esc(selectedWorkshop.name)+'</div><div class="t">🕐 '+esc(w.time)+' h · '+fmtFullDate(w.date)+'</div></div>';
  if(selectedWorkshop.price>0)h+='<div class="price"><div class="amt">'+priceStr+' €</div><div class="lbl">Reserva</div></div>';
  h+='</div>';
  h+='<div class="err-msg" id="bkErr"></div>';
  h+='<div class="field"><label for="bkName">Tu nombre completo</label><input id="bkName" type="text" autocomplete="name" placeholder="Nombre y apellidos" maxlength="60"></div>';
  h+='<div class="field"><label for="bkPhone">Teléfono móvil</label><input id="bkPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="6XX XXX XXX" maxlength="20"></div>';
  h+='<div class="field"><label for="bkNote">Nota (opcional)</label><textarea id="bkNote" placeholder="¿Alguna alergia, duda o preferencia?" maxlength="300"></textarea></div>';
  h+='<label class="gdpr"><input type="checkbox" id="bkGdpr"><span>Acepto que Centro Cuídate guarde mis datos para gestionar esta reserva.</span></label>';
  if(selectedWorkshop.price>0 && selectedWorkshop.sumupLink){
    h+='<button class="pay-btn" id="payBtn" onclick="startBooking()">✨ Reservar y pagar '+priceStr+' €</button>';
    h+='<div class="pay-note"><span class="pay-secure">🔒 Pago seguro con SumUp</span> · Reservas tu plaza y completas el pago en el siguiente paso</div>';
  }else if(selectedWorkshop.price>0 && !selectedWorkshop.sumupLink){
    h+='<button class="pay-btn" id="payBtn" style="background:var(--grad)" onclick="startBooking()">✨ Solicitar plaza</button>';
    h+='<div class="pay-note">El pago se coordinará directamente con el centro tras tu solicitud.</div>';
  }else{
    h+='<button class="pay-btn" id="payBtn" style="background:var(--grad)" onclick="startBooking()">✨ Reservar mi plaza (gratis)</button>';
    h+='<div class="pay-note">Reserva sin coste · Plazas limitadas</div>';
  }
  h+='</div>';
  $('sheet').innerHTML=h;
  openOvl();
}

var _closeTimer=null;
function openOvl(){ var o=$('ovl'); if(_closeTimer){clearTimeout(_closeTimer);_closeTimer=null;} o.style.display='flex'; requestAnimationFrame(function(){o.classList.add('on');}); document.body.style.overflow='hidden'; }
function closeSheet(){ var o=$('ovl'); o.classList.remove('on'); document.body.style.overflow=''; if(_closeTimer)clearTimeout(_closeTimer); _closeTimer=setTimeout(function(){o.style.display='none';_closeTimer=null;},300); }
$('ovl').addEventListener('click',function(e){ if(e.target===this)closeSheet(); });

function bkErr(msg){ var e=$('bkErr'); if(e){e.textContent=msg;e.classList.add('on');} }

function startBooking(){
  var name=($('bkName').value||'').trim();
  var phoneRaw=($('bkPhone').value||'').trim();
  var note=($('bkNote').value||'').trim().slice(0,300);
  if(name.length<2){ bkErr('Escribe tu nombre completo.'); $('bkName').focus(); return; }
  if(!validPhone(phoneRaw)){ bkErr('Introduce un teléfono válido (solo números).'); $('bkPhone').focus(); return; }
  if(!$('bkGdpr').checked){ bkErr('Debes aceptar el tratamiento de tus datos para reservar.'); return; }
  var phone=normPhone(phoneRaw);

  var w=workshops[selectedWorkshop.id];
  var occupied=w?(Array.isArray(w.attendees)?w.attendees.length:Object.keys(w.attendees||{}).length):0;
  if(w&&occupied>=(w.maxAttendees||8)){ bkErr('Lo sentimos, este taller se acaba de completar.'); return; }

  var btn=$('payBtn'); if(btn){btn.disabled=true;btn.textContent='Preparando…';}
  var reqId='req_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  var paid=!!(selectedWorkshop.price>0 && selectedWorkshop.sumupLink);
  var req={
    id:reqId, center:sede, centerName:center.name,
    service:selectedWorkshop.name, serviceId:'spa_facial',
    isWorkshop:true, workshopId:selectedWorkshop.id,
    date:selectedWorkshop.date, time:selectedWorkshop.time,
    dur:selectedWorkshop.dur||90, price:selectedWorkshop.price,
    clientName:name, clientPhone:phone, note:note,
    status: paid ? 'pending_payment' : 'pending',
    paid:false, createdAt:new Date().toISOString()
  };

  try{ localStorage.setItem('cc_pending_booking', JSON.stringify({req:req, sede:sede})); }catch(e){}

  function afterWrite(){
    if(paid){ showPayScreen(req); }   // OPCIÓN A: reservada → completar pago
    else{ finalizeBooking(req, false); }
  }

  if(fbDB){
    var writes=[];
    writes.push(fbDB.ref('centrocuidate/booking/'+sede+'/requests/'+reqId).set(req));
    writes.push(fbDB.ref('centrocuidate/booking/'+sede+'/workshops/'+selectedWorkshop.id+'/attendees/'+reqId).set({
      name:name, phone:phone, note:note,
      status: paid ? 'pending_payment' : 'pending',
      requestId:reqId, createdAt:new Date().toISOString()
    }));
    Promise.all(writes).then(afterWrite).catch(function(){ afterWrite(); });
  }else{ afterWrite(); }
}

/* OPCIÓN A · Tras crear la reserva, mostramos una pantalla que confirma
   que la plaza queda reservada y ofrece completar el pago en SumUp.
   (Los enlaces simples de SumUp no redirigen de vuelta, así que no
   dependemos de eso: el centro confirma el pago desde su app.) */
function showPayScreen(req){
  closeSheet();
  var d=new Date(req.date+'T00:00:00');
  var priceStr=(req.price>0?req.price.toFixed(2).replace('.',','):'');
  var h='<div class="sheet-handle"></div>';
  h+='<div class="success-wrap">';
  h+='<div class="success-ring" style="background:var(--grad-gold);box-shadow:0 12px 34px rgba(201,149,42,.36)">💳</div>';
  h+='<h2>¡Plaza reservada!</h2>';
  h+='<p>Tu plaza en <strong>'+esc(req.service)+'</strong> queda <strong>reservada</strong>. Solo falta <strong>completar el pago</strong> para confirmarla.</p>';
  h+='<div class="success-card">';
  h+='<div class="success-row"><span class="k">Taller</span><span class="v">'+esc(req.service)+'</span></div>';
  h+='<div class="success-row"><span class="k">Fecha</span><span class="v">'+fmtFullDate(req.date)+'</span></div>';
  h+='<div class="success-row"><span class="k">Hora</span><span class="v">'+esc(req.time)+' h</span></div>';
  if(priceStr)h+='<div class="success-row"><span class="k">Importe</span><span class="v">'+priceStr+' €</span></div>';
  h+='</div>';
  h+='<a class="pay-btn" style="text-decoration:none;margin:0 6px" href="'+esc(selectedWorkshop.sumupLink)+'" target="_blank" rel="noopener" onclick="_paid=true">💳 Pagar '+(priceStr?priceStr+' € ':'')+'ahora</a>';
  h+='<div class="pay-note"><span class="pay-secure">🔒 Pago seguro con SumUp</span><br>En cuanto recibamos el pago, el centro te confirmará la plaza por WhatsApp.</div>';
  h+='<button class="pay-btn" style="background:var(--surface-3);color:var(--text-2);box-shadow:none;margin:12px 6px 0;width:calc(100% - 12px)" onclick="location.href=\'booking.html?sede='+sede+'\'">Volver a los talleres</button>';
  h+='</div>';
  $('sheet').innerHTML=h;
  openOvl();
}

/* (Compatibilidad) Si algún día se configura un retorno con ?paid=1, lo
   aceptamos y confirmamos; si no, no hace nada. */
(function handlePaymentReturn(){
  var params=new URLSearchParams(location.search);
  if(params.get('paid')!=='1')return;
  var pend=null;
  try{ pend=JSON.parse(localStorage.getItem('cc_pending_booking')||'null'); }catch(e){}
  if(!pend||!pend.req)return;
  var req=pend.req; req.paid=true; req.status='confirmed'; req.paidAt=new Date().toISOString();
  try{ localStorage.removeItem('cc_pending_booking'); }catch(e){}
  try{ history.replaceState({},'','booking.html?sede='+(pend.sede||sede)); }catch(e){}
  try{
    if(typeof firebase!=='undefined'&&firebase.database){
      var db=firebase.database(); var sd=pend.sede||sede;
      var u={};
      u['centrocuidate/booking/'+sd+'/requests/'+req.id+'/status']='confirmed';
      u['centrocuidate/booking/'+sd+'/requests/'+req.id+'/paid']=true;
      u['centrocuidate/booking/'+sd+'/workshops/'+req.workshopId+'/attendees/'+req.id+'/status']='confirmed';
      u['centrocuidate/booking/'+sd+'/workshops/'+req.workshopId+'/attendees/'+req.id+'/paid']=true;
      db.ref().update(u);
    }
  }catch(e){}
  finalizeBooking(req, true);
})();

function notifyConfirmation(req, sd){
  try{
    if(typeof firebase==='undefined')return;
    var db=firebase.database();
    db.ref('centrocuidate/booking/'+sd+'/config/gcalUrl').once('value').then(function(s){
      var url=s.val(); if(!url)return;
      var payload={ action:'confirmWorkshop', clientName:req.clientName, phone:req.clientPhone,
        service:req.service, date:req.date, startTime:req.time, dur:req.dur||90,
        note:req.note||'', center:sd };
      fetch(url,{ method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(payload) }).catch(function(){});
    }).catch(function(){});
  }catch(e){}
}

function finalizeBooking(req, paid){
  closeSheet();
  var h='<div class="sheet-handle"></div>';
  h+='<div class="success-wrap">';
  h+='<div class="success-ring">✓</div>';
  h+='<h2>'+(paid?'¡Plaza confirmada!':'¡Reserva enviada!')+'</h2>';
  h+='<p>'+(paid
    ? 'Tu pago se ha completado y tu plaza queda <strong>reservada</strong>. Recibirás la confirmación por WhatsApp.'
    : 'Hemos recibido tu solicitud. El centro te confirmará la plaza por WhatsApp lo antes posible.')+'</p>';
  h+='<div class="success-card">';
  h+='<div class="success-row"><span class="k">Taller</span><span class="v">'+esc(req.service)+'</span></div>';
  h+='<div class="success-row"><span class="k">Fecha</span><span class="v">'+fmtFullDate(req.date)+'</span></div>';
  h+='<div class="success-row"><span class="k">Hora</span><span class="v">'+esc(req.time)+' h</span></div>';
  h+='<div class="success-row"><span class="k">A nombre</span><span class="v">'+esc(req.clientName)+'</span></div>';
  if(paid&&req.price>0)h+='<div class="success-row"><span class="k">Pagado</span><span class="v">'+req.price.toFixed(2).replace('.',',')+' €</span></div>';
  h+='</div>';
  var num=ownerPhone?(ownerPhone.indexOf('34')===0?ownerPhone:'34'+ownerPhone):'';
  if(num)h+='<a class="empty" style="display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--wa);color:#fff;padding:14px;font-weight:800;font-size:14px;margin:0 6px" target="_blank" rel="noopener" href="https://wa.me/'+num+'?text='+encodeURIComponent('Hola, acabo de reservar plaza en el taller del '+fmtFullDate(req.date)+' a las '+req.time+'. ¡Gracias!')+'">💬 Escribir al centro</a>';
  h+='<button class="pay-btn" style="background:var(--grad);margin:16px 6px 0;width:calc(100% - 12px)" onclick="location.href=\'booking.html?sede='+sede+'\'">Ver más talleres</button>';
  h+='</div>';
  $('sheet').innerHTML=h;
  openOvl();
}

function toast(msg){
  var t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 20px;border-radius:var(--r-pill);font-size:13.5px;font-weight:700;z-index:300;box-shadow:var(--sh-lg);opacity:0;transition:opacity .2s';
  document.body.appendChild(t);
  requestAnimationFrame(function(){t.style.opacity='1';});
  setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove();},250);},2600);
}
</script>
